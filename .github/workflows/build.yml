name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # nötig, um Releases anzulegen

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: whisper.cpp holen (genaue Spracherkennung)
        continue-on-error: true
        run: git clone --depth 1 --branch v1.7.2 https://github.com/ggerganov/whisper.cpp.git app/src/main/cpp/whisper.cpp
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - run: gradle assembleDebug --no-daemon -PbuildNumber=${{ github.run_number }}
      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk CutLab-build-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cutlab-debug-apk
          path: CutLab-build-${{ github.run_number }}.apk
      - name: GitHub Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CutLab Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: CutLab-build-${{ github.run_number }}.apk
